name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v0.0.0.4)'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use the SDK that ships with the runner
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || \
              echo "::warning::sdkmanager could not add the packages"
          fi

      - name: Build the signed APK
        env:
          AEMU_KEYSTORE_B64: ${{ secrets.AEMU_KEYSTORE_B64 }}
          AEMU_KEYSTORE_PASSWORD: ${{ secrets.AEMU_KEYSTORE_PASSWORD }}
          AEMU_KEY_ALIAS: ${{ secrets.AEMU_KEY_ALIAS }}
          AEMU_KEY_PASSWORD: ${{ secrets.AEMU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "$AEMU_KEYSTORE_B64" ]; then
            echo "::error::the release signing key is not configured, refusing to publish a debug build"
            exit 1
          fi
          echo "$AEMU_KEYSTORE_B64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$AEMU_KEYSTORE_PASSWORD" "$AEMU_KEY_ALIAS" "$AEMU_KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon --stacktrace :app:assembleStandardRelease

      - name: Collect and check the APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/standard/release/*.apk out/app.aemu.apk
          APK=out/app.aemu.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          VERSION=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\3/p")
          echo "versionName=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "### AEmulator CE ${{ github.ref_name }}"
            echo ""
            echo '```'
            "$BT/aapt2" dump badging "$APK" | head -3
            "$BT/apksigner" verify --print-certs "$APK" | head -4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AEmulator CE ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/app.aemu.apk
          body: |
            Signed build of AEmulator CE.

            Android 8.0 and later, arm64.

            The APK is signed with the project release key, so it installs over an earlier build of this project
            without uninstalling it.
