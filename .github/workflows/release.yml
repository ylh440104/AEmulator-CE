name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v0.0.0.4)'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle.kts', 'build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use the SDK that ships with the runner
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || \
              echo "::warning::sdkmanager could not add the packages"
          fi
      - name: Rebuild the guest shim when its source changed
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -n "$SM" ] || { echo "::warning::no sdkmanager, the shim stays as committed"; exit 0; }
          yes | "$SM" --install "ndk;27.2.12479018" > /dev/null 2>&1 || { echo "::warning::NDK install failed"; exit 0; }
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          [ -n "$NDK" ] || { echo "::warning::no NDK found"; exit 0; }
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          [ -x "$CC" ] || { echo "::warning::no clang in the NDK"; exit 0; }
          OUT="app/src/main/assets/engines/common/libaemushim.so"
          cd native/guestshim
          "$CC" --target=armv7a-linux-androideabi21 -march=armv7-a -mthumb -Os -fPIC -shared -nostdlib \
            -fvisibility=hidden -fno-stack-protector -ffreestanding -fno-builtin \
            -Wl,--hash-style=sysv -Wl,-z,norelro -Wl,--no-undefined \
            -Wl,-soname,libaemushim.so -Wl,--build-id=none -o "../../$OUT" aemushim.c crash.c -lc || \
            { echo "::error::the shim failed to rebuild"; exit 1; }
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "../../$OUT" 2>/dev/null || true
          cd ../audiohal
          "$CC" --target=armv7a-linux-androideabi21 -march=armv7-a -mthumb -mfloat-abi=softfp -Os -fPIC -shared \
            -nostdlib -ffreestanding -fno-builtin -fvisibility=hidden -fno-stack-protector -DAEMU_V1 \
            -Wl,--hash-style=sysv -Wl,-z,norelro -Wl,--build-id=none -Wl,-soname,audio.primary.default.so \
            -o "../../app/src/main/assets/engines/kk/audio.primary.v1.so" audio_hal.c -lc || \
            { echo "::error::the 4.1 audio HAL failed to rebuild"; exit 1; }
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "../../app/src/main/assets/engines/kk/audio.primary.v1.so" 2>/dev/null || true
          cd ../..
          git diff --stat -- "$OUT"
          # sensesbinderd: the /dev/binder daemon for the SENSES translator (1.x), built from the same
          # protocol header libqemu_senses.so was built with; the engine's binderd speaks another one
          "$CC" --target=aarch64-linux-android26 -O2 -D_GNU_SOURCE -Wall -Wno-unused-function \
            -o app/src/main/jniLibs/arm64-v8a/libsensesbinderd.so native/sensesbinderd/sensesbinderd.c || \
            { echo "::error::the 1.x binder daemon failed to build"; exit 1; }
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" app/src/main/jniLibs/arm64-v8a/libsensesbinderd.so 2>/dev/null || true

      - name: Build the signed APK
        env:
          AEMU_KEYSTORE_B64: ${{ secrets.AEMU_KEYSTORE_B64 }}
          AEMU_KEYSTORE_PASSWORD: ${{ secrets.AEMU_KEYSTORE_PASSWORD }}
          AEMU_KEY_ALIAS: ${{ secrets.AEMU_KEY_ALIAS }}
          AEMU_KEY_PASSWORD: ${{ secrets.AEMU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "$AEMU_KEYSTORE_B64" ]; then
            echo "::error::the release signing key is not configured, refusing to publish a debug build"
            exit 1
          fi
          echo "$AEMU_KEYSTORE_B64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$AEMU_KEYSTORE_PASSWORD" "$AEMU_KEY_ALIAS" "$AEMU_KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon --stacktrace :app:assembleStandardRelease

      - name: Collect and check the APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/standard/release/*.apk out/app.aemu.apk
          APK=out/app.aemu.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          VERSION=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\3/p")
          echo "versionName=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "### AEmulator CE ${{ github.ref_name }}"
            echo ""
            echo '```'
            "$BT/aapt2" dump badging "$APK" | head -3
            "$BT/apksigner" verify --print-certs "$APK" | head -4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AEmulator CE ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/app.aemu.apk
          body: |
            Signed build of AEmulator CE.
            Android 8.0 and later, arm64.
            The APK is signed with the project release key, so it installs over an earlier build of this project
            without uninstalling it.

            Fixed in this line of builds:
            - 2.x firmware no longer runs natively (non-PIE binaries are refused by a modern kernel) and its
              dalvik JIT is off under the qemu translator (TCG segfaults killed system_server after boot)
            - 4.1 TouchWiz boots again: an audio HAL reporting version 1.0 instead of 2.0, and the vendor
              audio_policy.conf is set aside so the engine one is read
            - Android 4.3+ firmware with SELinux: guest libselinux sees the emulator as SELinux-less
            - Android 16 GSI: guest mmap results are aligned to 16 KB, as ART's kElfSegmentAlignment check demands
            - Motorola fastboot xml packages (system_signed/boot_signed/recovery_signed) import
            - Sony ftf sin entries with a middle name segment (system.ext4.sin) import
            - The AOSP 1.x setup wizard is skipped (it died on a missing provider and left a black screen)
            - Log directories are capped (a busy image accumulated 228 GB overnight)

            Report problems at https://github.com/ylh440104/AEmulator-CE/issues
